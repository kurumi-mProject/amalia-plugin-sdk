name: Platform verification

on:
  push:
    branches: ["**"]
    paths:
      - "platform/**"
      - "examples/open-contract/**"
      - "examples/independent-plugin/**"
      - "examples/sdk3/**"
      - "tools/amalia"
      - "tools/amalia_cli.py"
      - "tools/PackagePlatformPlugin.py"
      - "docs/SDK_CLI.md"
      - "gradle/**"
      - "gradlew"
      - ".github/workflows/platform.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  platform:
    name: Protocol, runtime and external contract
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Make wrapper executable
        run: chmod +x gradlew
      - name: Compile independent platform
        run: ./gradlew -p platform :protocol:jar :runtime:jar --no-daemon --console=plain
      - name: Run external contract example
        run: ./gradlew -p examples/open-contract :run --no-daemon --console=plain
      - name: Publish distributable SDK repository
        run: ./gradlew -p platform :protocol:publishSdkPublicationToSdkDistributionRepository :runtime:publishSdkPublicationToSdkDistributionRepository --no-daemon --console=plain
      - name: Compile author project outside checkout using published artifacts
        shell: bash
        run: |
          author_project=$(mktemp -d)
          cp -R examples/independent-plugin/. "$author_project/"
          ./gradlew -p "$author_project" jar -PamaliaSdkRepository="$GITHUB_WORKSPACE/platform/build/sdk-repository" --no-daemon --console=plain
      - uses: android-actions/setup-android@v3
      - name: Install D8 for plugin DEX packaging (no APK build)
        run: sdkmanager "build-tools;35.0.0"
      - name: Compile and package generated SDK facade project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/amalia-bin"
          printf '#!/usr/bin/env bash\nexec "%s/gradlew" "$@"\n' "$GITHUB_WORKSPACE" > "$RUNNER_TEMP/amalia-bin/gradle"
          chmod +x "$RUNNER_TEMP/amalia-bin/gradle"
          export PATH="$RUNNER_TEMP/amalia-bin:$PATH"
          author_project="$RUNNER_TEMP/sdk3-generated"
          sdk_repository="$GITHUB_WORKSPACE/platform/build/sdk-repository"
          ./tools/amalia create plugin ci-generated --directory "$author_project"
          ./tools/amalia add network "$author_project" --domain api.open-meteo.com
          for module in media background notifications browser device secrets; do
            ./tools/amalia add "$module" "$author_project"
          done
          ./tools/amalia validate "$author_project"
          openssl ecparam -name prime256v1 -genkey -noout -out "$RUNNER_TEMP/publisher.pem"
          ./tools/amalia package "$author_project" \
            --private-key "$RUNNER_TEMP/publisher.pem" --key-id ci-ephemeral \
            --d8 "$ANDROID_HOME/build-tools/35.0.0/d8" \
            --gradle-arg=-PamaliaSdkRepository="$sdk_repository"
          printf '%s\n' 'tools' 'grant invoke' 'invoke echo {"query":"CI"}' 'quit' | \
            ./tools/amalia dev "$author_project" \
              --gradle-arg=-PamaliaSdkRepository="$sdk_repository" 2>&1 | tee "$RUNNER_TEMP/sdk3-generated-console.log"
          grep -F 'Hello from ci-generated: CI' "$RUNNER_TEMP/sdk3-generated-console.log"
          ! grep -E 'Command failed|"type":"failure"' "$RUNNER_TEMP/sdk3-generated-console.log"
      - name: Compile, package and exercise SDK reference plugins
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$RUNNER_TEMP/amalia-bin:$PATH"
          sdk_repository="$GITHUB_WORKSPACE/platform/build/sdk-repository"
          for project in examples/sdk3/*/; do
            name=$(basename "$project")
            ./tools/amalia validate "$project"
            ./tools/amalia package "$project" \
              --private-key "$RUNNER_TEMP/publisher.pem" --key-id ci-ephemeral \
              --d8 "$ANDROID_HOME/build-tools/35.0.0/d8" \
              --gradle-arg=-PamaliaSdkRepository="$sdk_repository"
            ./tools/amalia dev "$project" --config "$project/dev.json" \
              --gradle-arg=-PamaliaSdkRepository="$sdk_repository" \
              < "$project/commands.txt" 2>&1 | tee "$RUNNER_TEMP/sdk3-$name-console.log"
            grep -F '"type":"success"' "$RUNNER_TEMP/sdk3-$name-console.log"
            ! grep -E 'Command failed|"type":"failure"' "$RUNNER_TEMP/sdk3-$name-console.log"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: sdk3-reference-packages
          path: |
            examples/sdk3/*/dist/*.amaliaplug
            ${{ runner.temp }}/sdk3-generated/dist/*.amaliaplug
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: amalia-sdk-repository
          path: platform/build/sdk-repository/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: amalia-platform-jars
          path: |
            platform/protocol/build/libs/*.jar
            platform/runtime/build/libs/*.jar
          if-no-files-found: error
