name: Build plugin package

# Собирает пример-плагин в готовый .amaliaplug: Kotlin → classes.dex → zip.
# Артефакт можно скачать и установить в приложение («Плагины → Установить
# из файла»), не собирая ничего локально.
#
# Почему напоминания собираются здесь, а не Android-плагином Gradle: плагин
# не часть приложения. Это отдельный артефакт, который компилируется против
# референс-копий контрактов хоста (`sdk/api/minimal`) и упаковывается в zip.

on:
  workflow_dispatch:
    inputs:
      example:
        description: "Папка примера в examples/"
        required: true
        default: "reminder-kotlin"
      publish_release:
        description: "Опубликовать релиз со ссылкой на скачивание"
        type: boolean
        default: true
  push:
    paths:
      - "examples/**"
      - "sdk/**"
      - "tools/**"
      - ".github/workflows/build-plugin.yml"
  pull_request:
    paths:
      - "examples/**"
      - "sdk/**"
      - "tools/**"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      EXAMPLE: ${{ github.event.inputs.example || 'reminder-kotlin' }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Locate Android SDK
        run: |
          set -euo pipefail
          for candidate in "$ANDROID_HOME" "$ANDROID_SDK_ROOT" /usr/local/lib/android/sdk; do
            if [[ -n "${candidate:-}" && -d "$candidate" ]]; then
              SDK="$candidate"
              break
            fi
          done
          if [[ -z "${SDK:-}" ]]; then
            echo "Android SDK не найден" >&2
            exit 1
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "SDK=$SDK"
          ls "$SDK/platforms" || true

      - name: Ensure android-34 platform and build-tools
        run: |
          set -euo pipefail
          if [[ ! -f "$ANDROID_HOME/platforms/android-34/android.jar" ]]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
              --install "platforms;android-34" "build-tools;34.0.0" > /dev/null
          fi
          # d8 может отсутствовать в базовом образе — ставим build-tools.
          if [[ ! -x "$ANDROID_HOME/build-tools/34.0.0/d8" ]]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
              --install "build-tools;34.0.0" > /dev/null
          fi
          ls -la "$ANDROID_HOME/platforms/android-34/android.jar"
          "$ANDROID_HOME/build-tools/34.0.0/d8" --version || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Compile plugin to jar
        run: gradle --no-daemon -p "examples/$EXAMPLE" :plugin:jar

      - name: Convert jar to classes.dex
        run: |
          set -euo pipefail
          D8="$ANDROID_HOME/build-tools/34.0.0/d8"
          JAR="examples/$EXAMPLE/plugin/build/libs/plugin.jar"
          [[ -f "$JAR" ]] || { echo "нет $JAR" >&2; exit 1; }
          mkdir -p "examples/$EXAMPLE/dex"
          # --min-api 26 = минимальная поддерживаемая версия Android у Амалии.
          # --lib даёт d8 список классов платформы: без него он ругается на
          # любой android.* и kotlin.*, которого нет в jar.
          "$D8" \
            --min-api 26 \
            --lib "$ANDROID_HOME/platforms/android-34/android.jar" \
            --output "examples/$EXAMPLE/dex" \
            "$JAR"
          ls -la "examples/$EXAMPLE/dex/"

      - name: Check dex does not contain host contracts
        run: python3 tools/check-dex.py "examples/$EXAMPLE/dex/classes.dex"

      - name: Package .amaliaplug
        id: package
        run: |
          set -euo pipefail
          cp "examples/$EXAMPLE/dex/classes.dex" "examples/$EXAMPLE/classes.dex"
          mkdir -p dist
          tools/pack.sh "examples/$EXAMPLE" dist/ | tee /tmp/pack.log
          PACKAGE="$(ls dist/*.amaliaplug | head -1)"
          echo "package=$PACKAGE" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$PACKAGE")" >> "$GITHUB_OUTPUT"
          python3 tools/validate.py "$PACKAGE"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: ${{ steps.package.outputs.package }}
          if-no-files-found: error

      - name: Publish release
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.publish_release != 'false' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="plugins-latest"
          TITLE="Plugin packages"
          BODY="$(printf 'Собранные пакеты примеров.\n\n- \`%s\`\n\nУстановка: **Настройки → Плагины → Установить из файла**.\n' "${{ steps.package.outputs.name }}")"
          # Тег всегда один и тот же: ссылка на скачивание не должна меняться
          # от сборки к сборке, иначе её невозможно дать пользователю.
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" \
            --title "$TITLE" \
            --notes "$BODY" \
            "${{ steps.package.outputs.package }}"
          gh release view "$TAG" --json url --jq .url

      - name: Summary
        run: |
          {
            echo "### Плагин собран"
            echo
            echo "- пример: \`$EXAMPLE\`"
            echo "- пакет: \`${{ steps.package.outputs.name }}\`"
            echo
            echo '```'
            cat /tmp/pack.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
